openapi: 3.0.3
info:
  title: NoCode Backend API
  version: 1.0.0
  description: API pour la plateforme NoCode - Création d'applications sans code
paths:
  /api/v1/foundation/auth/change-password/:
    post:
      operationId: foundation_auth_change_password_create
      tags:
      - foundation
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/foundation/auth/login/:
    post:
      operationId: foundation_auth_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - foundation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/v1/foundation/auth/logout/:
    post:
      operationId: foundation_auth_logout_create
      tags:
      - foundation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/foundation/auth/password-reset/:
    post:
      operationId: foundation_auth_password_reset_create
      tags:
      - foundation
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/foundation/auth/password-reset/confirm/:
    post:
      operationId: foundation_auth_password_reset_confirm_create
      tags:
      - foundation
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/foundation/auth/refresh/:
    post:
      operationId: foundation_auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - foundation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/foundation/auth/register/client/:
    post:
      operationId: foundation_auth_register_client_create
      tags:
      - foundation
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/foundation/organizations/:
    get:
      operationId: foundation_organizations_retrieve
      description: Liste les organisations de l'utilisateur.
      tags:
      - foundation
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: foundation_organizations_create
      description: Crée une nouvelle organisation.
      tags:
      - foundation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrganizationCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrganizationCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationDetail'
          description: ''
  /api/v1/foundation/organizations/{org_id}/:
    get:
      operationId: foundation_organizations_retrieve_2
      description: Récupère les détails d'une organisation.
      parameters:
      - in: path
        name: org_id
        schema:
          type: integer
        required: true
      tags:
      - foundation
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    put:
      operationId: foundation_organizations_update
      description: Met à jour une organisation.
      parameters:
      - in: path
        name: org_id
        schema:
          type: integer
        required: true
      tags:
      - foundation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrganizationUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrganizationUpdateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationDetail'
          description: ''
    delete:
      operationId: foundation_organizations_destroy
      description: Supprime une organisation.
      parameters:
      - in: path
        name: org_id
        schema:
          type: integer
        required: true
      tags:
      - foundation
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/foundation/organizations/{org_id}/leave/:
    post:
      operationId: foundation_organizations_leave_create
      description: Quitte une organisation.
      parameters:
      - in: path
        name: org_id
        schema:
          type: integer
        required: true
      tags:
      - foundation
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/foundation/organizations/{org_id}/members/:
    get:
      operationId: foundation_organizations_members_retrieve
      description: Liste les membres d'une organisation.
      parameters:
      - in: path
        name: org_id
        schema:
          type: integer
        required: true
      tags:
      - foundation
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/foundation/organizations/{org_id}/members/{member_id}/:
    put:
      operationId: foundation_organizations_members_update
      description: Met à jour un membre d'organisation.
      parameters:
      - in: path
        name: member_id
        schema:
          type: integer
        required: true
      - in: path
        name: org_id
        schema:
          type: integer
        required: true
      tags:
      - foundation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationMember'
          description: ''
    delete:
      operationId: foundation_organizations_members_destroy
      description: Supprime un membre d'une organisation.
      parameters:
      - in: path
        name: member_id
        schema:
          type: integer
        required: true
      - in: path
        name: org_id
        schema:
          type: integer
        required: true
      tags:
      - foundation
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/foundation/organizations/{org_id}/stats/:
    get:
      operationId: foundation_organizations_stats_retrieve
      description: Récupère les statistiques d'une organisation.
      parameters:
      - in: path
        name: org_id
        schema:
          type: integer
        required: true
      tags:
      - foundation
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/foundation/organizations/{org_id}/transfer-ownership/:
    post:
      operationId: foundation_organizations_transfer_ownership_create
      description: Transfère la propriété d'une organisation.
      parameters:
      - in: path
        name: org_id
        schema:
          type: integer
        required: true
      tags:
      - foundation
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/foundation/payment-methods/:
    get:
      operationId: foundation_payment_methods_retrieve
      description: Liste les moyens de paiement de l'utilisateur.
      tags:
      - foundation
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: foundation_payment_methods_create
      description: Ajoute un nouveau moyen de paiement.
      tags:
      - foundation
      security:
      - jwtAuth: []
      responses:
        '201':
          description: No response body
  /api/v1/foundation/subscription-plans/:
    get:
      operationId: foundation_subscription_plans_list
      description: API pour consulter les plans d'abonnement disponibles.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - foundation
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTypeAbonnementList'
          description: ''
  /api/v1/foundation/subscription-plans/{id}/:
    get:
      operationId: foundation_subscription_plans_retrieve
      description: API pour consulter les plans d'abonnement disponibles.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Type d'abonnement.
        required: true
      tags:
      - foundation
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TypeAbonnement'
          description: ''
  /api/v1/foundation/subscription-plans/compare/:
    get:
      operationId: foundation_subscription_plans_compare_retrieve
      description: Compare tous les plans disponibles.
      tags:
      - foundation
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TypeAbonnement'
          description: ''
  /api/v1/foundation/subscriptions/:
    get:
      operationId: foundation_subscriptions_list
      description: API pour consulter et gérer les abonnements.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - foundation
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAbonnementList'
          description: ''
  /api/v1/foundation/subscriptions/{id}/:
    get:
      operationId: foundation_subscriptions_retrieve
      description: API pour consulter et gérer les abonnements.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - foundation
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Abonnement'
          description: ''
  /api/v1/foundation/subscriptions/{id}/cancel/:
    post:
      operationId: foundation_subscriptions_cancel_create
      description: Annule un abonnement.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - foundation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AbonnementRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AbonnementRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AbonnementRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Abonnement'
          description: ''
  /api/v1/foundation/subscriptions/{id}/upgrade/:
    post:
      operationId: foundation_subscriptions_upgrade_create
      description: Met à niveau un abonnement vers un plan supérieur.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - foundation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AbonnementRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AbonnementRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AbonnementRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Abonnement'
          description: ''
  /api/v1/foundation/subscriptions/{id}/usage/:
    get:
      operationId: foundation_subscriptions_usage_retrieve
      description: Retourne l'utilisation actuelle de l'abonnement.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - foundation
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Abonnement'
          description: ''
  /api/v1/foundation/subscriptions/create_subscription/:
    post:
      operationId: foundation_subscriptions_create_subscription_create
      description: Crée un nouvel abonnement pour l'utilisateur.
      tags:
      - foundation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AbonnementRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AbonnementRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AbonnementRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Abonnement'
          description: ''
  /api/v1/foundation/subscriptions/current/:
    get:
      operationId: foundation_subscriptions_current_retrieve
      description: Retourne l'abonnement actif de l'utilisateur.
      tags:
      - foundation
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Abonnement'
          description: ''
  /api/v1/foundation/users/{user_id}/deactivate/:
    post:
      operationId: foundation_users_deactivate_create
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - foundation
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/foundation/users/{user_id}/organizations/:
    get:
      operationId: foundation_users_organizations_retrieve
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - foundation
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/foundation/users/profile/:
    get:
      operationId: foundation_users_profile_retrieve
      description: Vue pour le profil utilisateur avec tracking_id.
      tags:
      - foundation
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    put:
      operationId: foundation_users_profile_update
      description: Met à jour le profil d'un utilisateur.
      tags:
      - foundation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
  /api/v1/foundation/users/profile/{user_id}/:
    get:
      operationId: foundation_users_profile_retrieve_2
      description: Vue pour le profil utilisateur avec tracking_id.
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - foundation
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    put:
      operationId: foundation_users_profile_update_2
      description: Met à jour le profil d'un utilisateur.
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - foundation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
  /api/v1/foundation/users/search/:
    get:
      operationId: foundation_users_search_retrieve
      description: Recherche des utilisateurs.
      tags:
      - foundation
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/foundation/users/stats/:
    get:
      operationId: foundation_users_stats_retrieve
      tags:
      - foundation
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/runtime/apps/:
    get:
      operationId: runtime_apps_list
      description: Retourne la liste des applications générées par l'utilisateur courant.
      summary: Lister les applications générées
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - runtime
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedGeneratedAppList'
          description: ''
        '403':
          description: Accès non autorisé
    post:
      operationId: runtime_apps_create
      description: Crée une nouvelle application générée.
      summary: Créer une nouvelle application
      tags:
      - runtime
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeneratedAppRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GeneratedAppRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GeneratedAppRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratedApp'
          description: ''
        '400':
          description: Données invalides
        '403':
          description: Accès non autorisé
  /api/v1/runtime/apps/{id}/:
    get:
      operationId: runtime_apps_retrieve
      description: Récupère les détails d'une application générée.
      summary: Récupérer une application
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Application générée.
        required: true
      tags:
      - runtime
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratedApp'
          description: ''
        '404':
          description: Application non trouvée
    put:
      operationId: runtime_apps_update
      description: Met à jour les informations d'une application générée.
      summary: Mettre à jour une application
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Application générée.
        required: true
      tags:
      - runtime
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeneratedAppRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GeneratedAppRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GeneratedAppRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratedApp'
          description: ''
        '400':
          description: Données invalides
        '403':
          description: Accès non autorisé
        '404':
          description: Application non trouvée
    patch:
      operationId: runtime_apps_partial_update
      description: API endpoint qui permet de gérer les applications générées.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Application générée.
        required: true
      tags:
      - runtime
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedGeneratedAppRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedGeneratedAppRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedGeneratedAppRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratedApp'
          description: ''
    delete:
      operationId: runtime_apps_destroy
      description: Supprime une application générée.
      summary: Supprimer une application
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Application générée.
        required: true
      tags:
      - runtime
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '403':
          description: Accès non autorisé
        '404':
          description: Application non trouvée
  /api/v1/runtime/apps/{id}/deploy/:
    post:
      operationId: runtime_apps_deploy_create
      description: Lance le déploiement d'une application générée sur l'environnement
        cible.
      summary: Déployer une application
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this Application générée.
        required: true
      tags:
      - runtime
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeploymentActionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeploymentActionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeploymentActionRequest'
      security:
      - jwtAuth: []
      responses:
        '202':
          description: Déploiement démarré avec succès
        '400':
          description: L'application n'est pas dans un état déployable
        '403':
          description: Accès non autorisé
        '404':
          description: Application non trouvée
        '500':
          description: Erreur lors du démarrage du déploiement
  /api/v1/runtime/apps/{id}/logs/:
    get:
      operationId: runtime_apps_logs_retrieve
      description: Récupère l'historique des journaux de déploiement pour une application
        spécifique.
